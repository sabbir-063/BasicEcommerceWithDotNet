services:
  api:
    build:
      context: ./back
    env_file:
      - ./back/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
    ports:
      - "8080:8080"
  web:
    build:
      context: ./front
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - api
    ports:
      - "5173:80"
